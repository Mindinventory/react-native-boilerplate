pre-commit:
  parallel: true # Run scripts in parallel for better performance
  scripts:
    lint:
      # Run ESLint to lint your JavaScript/TypeScript files
      run: "eslint . --ext .js,.jsx,.ts,.tsx"
      include: "src/**/*.{js,jsx,ts,tsx}" # Include files in the src directory
      exclude: "node_modules/**/*" # Exclude node_modules folder

    prettier:
      # Run Prettier to format your code
      run: "prettier --write ."
      include: "src/**/*.{js,jsx,ts,tsx}"
      exclude: "node_modules/**/*"
